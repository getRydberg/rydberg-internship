services:
  web:
    build: .
    ports: ["127.0.0.1:8091:8080"]
    environment:
      INTERNSHIP_DATABASE: /data/internship.sqlite3
      INTERNSHIP_AUTH_MODE: name
      INTERNSHIP_PUBLIC_ORIGIN: http://localhost:8091
    volumes: ["internship-data:/data"]
    restart: unless-stopped
  worker:
    build: .
    command: [python, -m, internship.worker]
    environment:
      INTERNSHIP_DATABASE: /data/internship.sqlite3
    volumes: ["internship-data:/data"]
    restart: unless-stopped
volumes:
  internship-data:
